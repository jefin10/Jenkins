<!DOCTYPE html>
<html>
<head>
  <title>Student Info</title>
</head>
<body>
  <h1>Student Details</h1>
  <p id="data"></p>

  <script>
    const apiUrl = "/student-details";

    fetch(apiUrl)
      .then((res) => {
        if (!res.ok) {
          throw new Error(`Request failed with status ${res.status}`);
        }
        return res.json();
      })
      .then(data => {
        document.getElementById("data").innerHTML =
          `Name: ${data.name} <br>
           Roll: ${data.rollNumber} <br>
           `;
      })
      .catch((error) => {
        document.getElementById("data").textContent = `Failed to load student details: ${error.message}`;
      });
  </script>
</body>
</html>
