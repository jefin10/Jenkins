<!DOCTYPE html>
<html>
<head>
  <title>Student Info</title>
</head>
<body>
  <h1>Student Details</h1>
  <p id="data"></p>

  <script>
    async function loadStudentDetails() {
      const urls = [
        `${window.location.origin}/student-details`,
        `${window.location.protocol}//${window.location.hostname}:5000/student-details`
      ];

      let lastError = null;

      for (const url of urls) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) {
            throw new Error(`Request failed with status ${res.status}`);
          }

          const data = await res.json();
          document.getElementById("data").innerHTML =
            `Name: ${data.name} <br>
             Roll: ${data.rollNumber} <br>`;
          return;
        } catch (error) {
          lastError = error;
        }
      }

      document.getElementById("data").textContent =
        `Failed to load student details. ${lastError ? lastError.message : "Unknown error"}`;
    }

    loadStudentDetails();
  </script>
</body>
</html>
